<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MACROXEL — Licencias</title>
<style>
:root{--bg:#f5f9ff;--card:#fff;--text:#132033;--muted:#68768a;--line:#dfe7f3;--blue:#1266f1;--blue2:#0a4dc2;--green:#12a66a;--red:#e5484d;--orange:#f59e0b;--shadow:0 16px 45px rgba(18,40,80,.12);--radius:22px}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#fff,#eef5ff);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wrap{width:min(1180px,94vw);margin:auto;padding:14px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.mxbot{width:56px;height:56px;border-radius:19px;background:linear-gradient(145deg,#e9f6ff,#fff);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;display:grid;place-items:center}.mxbot:before{content:"";position:absolute;width:31px;height:23px;border-radius:12px;background:#1266f1;top:14px}.mxbot:after{content:"+";position:absolute;color:#fff;font-weight:900;font-size:21px;top:12px}.ears{position:absolute;inset:auto -7px 20px -7px;display:flex;justify-content:space-between}.ears i{width:12px;height:20px;background:#24b8a8;border-radius:8px}.face{position:absolute;bottom:9px;font-size:16px}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px}.sat{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#53657c;font-size:12px;font-weight:900}.satdot{width:11px;height:11px;border-radius:999px;background:#94a3b8;box-shadow:0 0 0 4px rgba(148,163,184,.15)}.sat.ok .satdot{background:#12a66a;box-shadow:0 0 0 4px rgba(18,166,106,.14)}.sat.bad .satdot{background:#e5484d;box-shadow:0 0 0 4px rgba(229,72,77,.14)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.actions{grid-template-columns:1fr}}button{width:100%;border:none;border-radius:15px;padding:13px 14px;color:#fff;background:linear-gradient(180deg,var(--blue),var(--blue2));font:inherit;font-weight:900;cursor:pointer}.green{background:linear-gradient(180deg,#19bd7b,#0e8d5a)}.danger{background:linear-gradient(180deg,#ff6267,#d92d33)}.ghost{background:#fff;color:#31445d;border:1px solid var(--line)}.secondary{background:#edf4ff;color:#12447d;border:1px solid #cfe1ff}.small{font-size:12px;color:var(--muted)}.oktext{color:#087d4d}.badtext{color:#c8242a}.warntext{color:#b45309}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}.liccard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 10px 30px rgba(18,40,80,.08);cursor:pointer;transition:.15s}.liccard:hover{transform:translateY(-1px);border-color:#9fc7ff}.lictitle{font-size:15px;font-weight:950;margin-bottom:8px}.licmeta{font-size:12px;color:var(--muted);line-height:1.45}.badge{display:inline-flex;border-radius:999px;padding:4px 10px;font-weight:900;font-size:11px;margin-top:10px}.ACTIVA{background:#e9fff4;color:#087d4d;border:1px solid #9ee9c6}.VENCIDA{background:#fff0f0;color:#c8242a;border:1px solid #ffc4c6}.SUSPENDIDA{background:#fff7e8;color:#a86500;border:1px solid #f5d28a}.SIN{background:#eef2f7;color:#475569;border:1px solid #dbe3ee}.days{float:right;color:#53657c;font-weight:850;font-size:12px;margin-top:13px}.empty{padding:28px;text-align:center;color:var(--muted)}
dialog{border:none;border-radius:24px;width:min(570px,94vw);padding:0;box-shadow:0 24px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(13,26,48,.38)}.modal{padding:20px}.modal h2{margin:0 0 6px}.modalgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.modalgrid{grid-template-columns:1fr}}label{font-size:12px;font-weight:800;color:#4b5d75;display:block;margin-bottom:6px}input,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:#fff;color:var(--text);outline:none;font:inherit}input:focus,select:focus{border-color:#7ab2ff;box-shadow:0 0 0 4px rgba(18,102,241,.12)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.row{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.toast{position:fixed;right:18px;bottom:18px;background:#132033;color:#fff;border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);display:none;z-index:10}.readonly{background:#f8fbff;color:#607083}
@media(max-width:560px){h1{font-size:18px}.wrap{width:96vw;padding:10px}.mxbot{width:48px;height:48px}.card{padding:12px}.cards{grid-template-columns:1fr}.top{align-items:flex-start}.sat{padding:7px 10px}}
</style>
</head>
<body>
<header><div class="wrap top"><div class="brand"><div class="mxbot"><div class="ears"><i></i><i></i></div><div class="face">● ●</div></div><div><h1>🗝️ Panel de Licencias MACROXEL</h1><div class="sub">Alta, edición y activación/desactivación.</div></div></div><div class="sat" id="sat"><span>🛰️</span><i class="satdot"></i><span id="satText">Conectando...</span></div></div></header>
<main class="wrap">
<section class="card">
  <div class="actions"><button id="refresh">🔄 Refrescar licencias</button><button id="add" class="green">➕ Registrar nueva licencia</button></div>
  <div class="small" style="margin-top:10px" id="msg">Listo.</div>
</section>
<section class="card"><div class="cards" id="cards"><div class="empty">Cargando licencias...</div></div></section>
</main>
<dialog id="modal"><div class="modal"><h2 id="modalTitle">Licencia</h2><div class="small" id="modalHelp">Edita la información y presiona Guardar cambios para enviarlo a Firebase.</div><div class="modalgrid" style="margin-top:14px"><div><label>Device ID</label><input id="mDevice" class="mono" autocomplete="off" spellcheck="false"/></div><div><label>Sucursal</label><input id="mSucursal" placeholder="Ej. FARMACIA HGAM"/></div><div><label>Plan</label><select id="mPlan"><option value="1 año">1 año</option><option value="5 años">5 años</option><option value="10 años" selected>10 años</option></select></div><div><label>Clave</label><input id="mKey" class="mono"/></div><div><label>Vence</label><input id="mExpires" class="mono"/></div><div><label>Estatus</label><select id="mActive"><option value="true">Activa</option><option value="false">Suspendida</option></select></div></div><div class="row" style="margin-top:16px"><button class="ghost" id="cancel" style="max-width:145px">Cancelar</button><button class="danger" id="delete" style="max-width:145px;display:none">Eliminar</button><button id="save" class="green" style="max-width:210px">Guardar cambios</button></div></div></dialog>
<div class="toast" id="toast"></div>
<script>
(function(){
const DB_URL='https://licenciasmacroxel-default-rtdb.firebaseio.com';
const PATH='/licenses';
const $=id=>document.getElementById(id);let cache=[];let currentId=null;let isNew=false;
const cleanUrl=()=>DB_URL.replace(/\/+$/,'');
const apiUrl=(id='')=>cleanUrl()+PATH+(id?'/'+encodeURIComponent(id):'')+'.json';
function setSat(ok,t){$('sat').className='sat '+(ok?'ok':'bad');$('satText').textContent=t}
function setMsg(t,cls=''){$('msg').innerHTML='<span class="'+cls+'">'+t+'</span>'}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function key(n=10){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let o='';for(let i=0;i<n;i++)o+=c[Math.floor(Math.random()*c.length)];return o}
function addYears(d,y){const x=new Date(d);x.setFullYear(x.getFullYear()+y);return x}
function yearsFromPlan(p){const n=parseInt(String(p||'10 años').match(/\d+/)?.[0]||'10',10);return [1,5,10].includes(n)?n:10}
function normalizeSucursal(s){s=String(s||'').trim().replace(/\s+/g,' ').toUpperCase();if(!s)return '';const pref='SISTEMA DE INVENTARIO ';if(!s.startsWith(pref))s=pref+s;return s}
function iso(d){return new Date(d).toISOString()}
function status(lic){const now=new Date();const exp=lic.expiresAt?new Date(lic.expiresAt):null;if(lic.active===false)return ['SUSPENDIDA',''];if(!exp||isNaN(exp))return ['SIN FECHA',''];const days=Math.floor((exp-now)/86400000);if(now>exp)return ['VENCIDA',days];return ['ACTIVA',days]}
function recalc(){cache.forEach(l=>{const s=status(l);l.status=s[0];l.days=s[1]})}
function render(){recalc();const el=$('cards');el.innerHTML='';const rows=[...cache].sort((a,b)=>(a.sucursal||a.deviceId||'').localeCompare(b.sucursal||b.deviceId||''));if(!rows.length){el.innerHTML='<div class="empty">Sin licencias.</div>';return}rows.forEach(l=>{const card=document.createElement('div');card.className='liccard';card.dataset.id=l.deviceId;card.innerHTML=`<div class="lictitle">${esc(normalizeSucursal(l.sucursal)||'SIN SUCURSAL')}</div><div class="licmeta mono">${esc(l.deviceId)}</div><div class="licmeta">Plan: <b>${esc(l.plan||'10 años')}</b></div><span class="badge ${l.status==='SIN FECHA'?'SIN':l.status}">${l.status}</span><span class="days">${typeof l.days==='number'?l.days+' d':''}</span>`;el.appendChild(card)})}
async function refresh(){try{setMsg('Cargando licencias...');setSat(false,'Conectando...');const r=await fetch(apiUrl());if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json()||{};cache=Object.keys(data).map(id=>({deviceId:id,...data[id],active:data[id]?.active!==false}));render();setMsg('Licencias cargadas correctamente.','oktext');setSat(true,'Conectado')}catch(e){setSat(false,'Desconectado');setMsg('Error al leer Firebase: '+e.message,'badtext')}}
async function saveLic(lic,oldId){const id=lic.deviceId;const obj={sucursal:normalizeSucursal(lic.sucursal)||'',plan:lic.plan||'10 años',key:lic.key||'',expiresAt:lic.expiresAt||'',active:lic.active!==false,updatedAt:new Date().toISOString()};const r=await fetch(apiUrl(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});if(!r.ok){setSat(false,'Sin permiso de escritura');throw new Error('HTTP '+r.status+' — Firebase no permitió guardar. Revisa que /licenses tenga permiso de escritura.')}if(oldId&&oldId!==id){await fetch(apiUrl(oldId),{method:'DELETE'}).catch(()=>{});}setSat(true,'Conectado')}
function openEdit(id){const l=cache.find(x=>x.deviceId===id);if(!l)return;currentId=id;isNew=false;$('modalTitle').textContent='Editar licencia';$('modalHelp').textContent='Edita la información y presiona Guardar cambios para enviarlo a Firebase.';$('mDevice').value=l.deviceId;$('mDevice').readOnly=false;$('mDevice').classList.remove('readonly');$('mSucursal').value=normalizeSucursal(l.sucursal||'');$('mPlan').value=l.plan||'10 años';if(!['1 año','5 años','10 años'].includes($('mPlan').value)) $('mPlan').value='10 años';$('mKey').value=l.key||'';$('mExpires').value=l.expiresAt||'';$('mActive').value=l.active!==false?'true':'false';$('delete').style.display='block';$('save').textContent='Guardar cambios';$('modal').showModal()}
function openNew(){currentId=null;isNew=true;$('modalTitle').textContent='Nueva licencia';$('modalHelp').textContent='El campo inicia en MACROXEL-. Captura solo el número que te mandan después del guion.';$('mDevice').readOnly=false;$('mDevice').classList.remove('readonly');$('mDevice').value='MACROXEL-';$('mSucursal').value='SISTEMA DE INVENTARIO ';$('mPlan').value='10 años';$('mKey').value=key(10);$('mExpires').value=iso(addYears(new Date(),10));$('mActive').value='true';$('delete').style.display='none';$('save').textContent='Guardar licencia';$('modal').showModal();setTimeout(()=>$('mDevice').focus(),80)}
function collect(){let id=$('mDevice').value.trim().toUpperCase().replace(/\s+/g,'');if(!id.startsWith('MACROXEL-'))id='MACROXEL-'+id.replace(/^[-]+/,'');return{deviceId:id,sucursal:normalizeSucursal($('mSucursal').value),plan:$('mPlan').value||'10 años',key:$('mKey').value.trim()||key(10),expiresAt:$('mExpires').value.trim(),active:$('mActive').value==='true'}}
async function saveFromModal(){try{const lic=collect();if(!lic.deviceId||lic.deviceId==='MACROXEL-')return alert('Falta Device ID');if(!lic.sucursal)return alert('Falta sucursal');if((isNew||lic.deviceId!==currentId)&&cache.some(x=>x.deviceId===lic.deviceId))return alert('Ese Device ID ya existe');setMsg('Guardando en Firebase...');await saveLic(lic,currentId);if(isNew)cache.push(lic);else{const idx=cache.findIndex(x=>x.deviceId===currentId);if(idx>=0)cache[idx]=lic}currentId=lic.deviceId;isNew=false;$('modal').close();render();setMsg('Cambios guardados en Firebase.','oktext');toast('Guardado correcto')}catch(e){setMsg('Error al guardar: '+e.message,'badtext');alert('No se pudo guardar: '+e.message)}}
async function deleteCurrent(){if(!currentId)return;if(!confirm('¿Eliminar esta licencia?'))return;try{setMsg('Eliminando en Firebase...');const r=await fetch(apiUrl(currentId),{method:'DELETE'});if(!r.ok)throw new Error('HTTP '+r.status+' — Firebase no permitió eliminar.');cache=cache.filter(x=>x.deviceId!==currentId);$('modal').close();render();setMsg('Licencia eliminada.','oktext');toast('Eliminada');setSat(true,'Conectado')}catch(e){setSat(false,'Sin permiso de escritura');setMsg('No se eliminó: '+e.message,'badtext')}}
$('cards').addEventListener('click',e=>{const c=e.target.closest('.liccard');if(c)openEdit(c.dataset.id)});
$('mDevice').addEventListener('input',()=>{let v=$('mDevice').value.toUpperCase().replace(/\s+/g,'');const suffix=v.replace(/^MACROXEL-?/i,'').replace(/^[-]+/,'');$('mDevice').value='MACROXEL-'+suffix});
$('refresh').onclick=refresh;$('add').onclick=openNew;$('cancel').onclick=()=>$('modal').close();$('save').onclick=saveFromModal;$('delete').onclick=deleteCurrent;$('mSucursal').addEventListener('input',()=>{const el=$('mSucursal');const pos=el.selectionStart;el.value=el.value.toUpperCase();try{el.setSelectionRange(pos,pos)}catch(e){}});$('mSucursal').addEventListener('blur',()=>{$('mSucursal').value=normalizeSucursal($('mSucursal').value)});$('mPlan').addEventListener('change',()=>{$('mExpires').value=iso(addYears(new Date(),yearsFromPlan($('mPlan').value)))});refresh();
})();
</script>
</body>
</html>
